name: Apply SmileBASIC demo title ID

on:
  push:
    branches:
      - contribution/smilebasic4-demo-title-id
    paths:
      - .github/workflows/apply-smilebasic-demo-title-id.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'dougchansan/titledb'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out only the target data and this temporary workflow
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          sparse-checkout: |
            /JP.ja.json
            /.github/workflows/apply-smilebasic-demo-title-id.yml
          sparse-checkout-cone-mode: false

      - name: Apply and validate the one-field correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          def blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          path = Path("JP.ja.json")
          original = path.read_bytes()
          assert blob_sha(original) == "58b94d195395875fa788afdb71946dd82145dee1", "Unexpected source revision"
          records = json.loads(original)
          key = "70030000009902"
          tid = "0100B4B00F9F6000"
          record = records[key]
          assert record["id"] is None
          assert record["isDemo"] is True
          assert record["nsuId"] == int(key)
          assert record["parentId"] == "0100C9100B06A000"
          assert not any(item.get("id") == tid for item in records.values())

          start = original.index(('"' + key + '": {').encode())
          end = original.index(b"\n    }", start)
          block = original[start:end]
          assert block.count(b'"id": null') == 1
          replacement = block.replace(b'"id": null', b'"id": "0100B4B00F9F6000"')
          patched = original[:start] + replacement + original[end:]
          records[key]["id"] = tid
          assert json.loads(patched) == records
          assert blob_sha(patched) == "01c5ac1270bc54a086609932822f6d09ef0212f5", "Unexpected output"
          path.write_bytes(patched)
          print("Validated: only the SmileBASIC demo title ID changes; all other bytes are preserved.")
          PY

      - name: Commit the result and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-smilebasic-demo-title-id.yml
          git add JP.ja.json
          git diff --cached --check
          git commit -m "Fix missing SmileBASIC 4 demo title ID"
          git push origin HEAD:contribution/smilebasic4-demo-title-id
